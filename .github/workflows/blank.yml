name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/fixed.keystore; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
      - name: Compile, run unit tests and lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SatelliteWallpaper-v${VERSION}-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteWallpaper-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
